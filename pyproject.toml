[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "picobot"
version = "0.5"
description = "A tiny bot built for simplicity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click",
    "langchain>=1.3.0,<1.4.0",
    "langchain-core>=1.4.0,<1.5.0",
    "langchain-openai>=1.1.0,<1.2.0",
    "langgraph>=1.2.0,<1.3.0",
    "rich",
]

[project.urls]
Homepage = "https://github.com/ngpeijiun/picobot"
Repository = "https://github.com/ngpeijiun/picobot"

[project.optional-dependencies]
web-search = [
    "langchain-tavily==0.2.18",
]

[project.scripts]
picobot = "picobot.cli:chat"

[tool.setuptools.packages.find]
where = ["src"]
